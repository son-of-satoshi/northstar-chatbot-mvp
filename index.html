<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Northstar Store | Customer Support</title>
  <link rel="stylesheet" href="styles.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>

  <!-- Background Store Simulation -->
  <div class="store-preview">
    <nav class="store-nav">
      <div class="logo">✨ Northstar Store</div>
      <div class="nav-links">
        <span>Shop</span>
        <span>Categories</span>
        <span>Track Order</span>
      </div>
    </nav>
    <div class="hero-banner">
      <h1><strong>Welcome to Northstar Support</strong></h1>
      <p>Need help with your order or returns? Chat with our virtual assistant below!</p>
    </div>
  </div>

  <!-- Clean Floating Chatbot Interface -->
  <div class="chat-card">
    <div class="chat-header">
      <div class="avatar-group">
        <span class="bot-avatar">🤖</span>
        <span class="status-dot"></span>
      </div>
      <div class="header-text">
        <h2>Northstar Assistant</h2>
        <span class="status-text">Online • Instant Support</span>
      </div>
    </div>

    <div class="chat-feed" id="chat-feed">
      <div class="message bot-message">
        👋 Hi there! Welcome to Northstar. How can I help you today?
      </div>
      
      <!-- Quick Actions for Non-Technical Users -->
      <div class="quick-replies" id="quick-replies">
        <button onclick="handleQuickReply('order')">📦 Track My Order</button>
        <button onclick="handleQuickReply('return')">🔄 Returns & Refunds</button>
        <button onclick="handleQuickReply('stock')">🏷️ Item Availability</button>
        <button onclick="handleQuickReply('human')">👤 Speak to Agent</button>
      </div>
    </div>

    <div class="chat-input-area">
      <input type="text" id="user-input" placeholder="Type your message or Order ID (e.g., ORD-9821)..." autocomplete="off">
      <button id="send-btn" aria-label="Send Message">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <line x1="22" y1="2" x2="11" y2="13"></line>
          <polygon points="22 2 15 22 11 13 2 9 22 2"></polygon>
        </svg>
      </button>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
